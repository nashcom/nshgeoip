# Full, standalone NGINX config demonstrating nshgeoip integration -- meant
# to replace /etc/nginx/nginx.conf entirely (see docker-run-nginx.sh),
# not to be dropped into conf.d/*.conf as a fragment.
#
# nshgeoip performs annotation only -- it never decides whether to allow or
# block a request. All policy (the country allow/deny map below) and all
# caching (the proxy_cache below) live entirely in this NGINX config, not
# in nshgeoip: NGINX already has purpose-built primitives for both (map,
# proxy_cache), so nshgeoip never needed to grow its own policy engine or
# its own cache to support this.
#
# Requires nginx built with the auth_request module
# (ngx_http_auth_request_module, included in the stock nginx.org / distro
# packages by default).
#
# One thing this can't demo by itself: $remote_addr is always the actual
# TCP peer NGINX sees -- through Docker's bridge network that's the
# bridge gateway (a private address, e.g. 172.17.0.1), which no real
# GeoIP database covers. That's expected, not a bug -- it proves the
# pipeline (auth_request -> nshgeoip -> parsed response) works even though
# the annotation itself comes back empty for a private test address; a
# real deployment sees real client IPs, and the country map below never
# blocks anything against a private test IP. It's also why the client
# can't just pass ?ip=... to control what gets looked up on / --
# $remote_addr is not something a request can spoof (unlike /lookup
# below, which is a deliberately unauthenticated debug endpoint -- see
# its own comment).

worker_processes auto;

# Each connection this proxy handles typically holds two file descriptors
# open at once (client + the nshgeoip subrequest, briefly) -- headroom
# beyond worker_connections avoids running the whole worker out of fds
# under a heavy concurrent burst.
worker_rlimit_nofile 16384;

events {
    # Default is 1024, easily exhausted under a concurrent load test.
    worker_connections 8192;

    # Accept every connection already queued when a worker wakes up,
    # instead of one per event-loop iteration -- the same fix applied to
    # nshgeoip's own accept loop (see src/server.cpp), for the same reason:
    # under a burst, one accept() per wake-up can't drain the kernel
    # backlog as fast as it fills.
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # --- caching the /_geoip subrequest (the "auth cache") -------------
    #
    # Stock NGINX's auth_request module has no caching directive of its
    # own -- the standard way to cache an auth_request result is
    # proxy_cache on the location it subrequests, which for us is
    # /_geoip below. A given client IP's GeoIP data doesn't change
    # request-to-request (only when the underlying MMDB file itself gets
    # updated, which happens on MaxMind's release cadence, not per
    # request), so caching it here avoids a socket round trip to nshgeoip
    # on every single request -- including for an entire NAT'd population
    # sharing one public IP, which collapses to one real nshgeoip lookup
    # per cache window instead of one per request.
    proxy_cache_path /var/cache/nginx/geoip levels=1:2 keys_zone=geoip_cache:10m max_size=100m inactive=1h
                      use_temp_path=off;

    # --- country allow/deny policy --------------------------------------
    #
    # Policy lives here, in NGINX config, not in nshgeoip -- nshgeoip only
    # ever answers "what do you know about this address," never "should
    # this be allowed." map is NGINX's purpose-built O(1) table lookup
    # for exactly this "look up a variable, decide something" pattern;
    # $geoip_country below is populated by auth_request_set further down,
    # and map's lazy per-request variable evaluation means declaration
    # order here doesn't matter. Empty by default (nothing blocked) --
    # add ISO country codes to try it, e.g. "CN 1;" / "RU 1;".
    map $geoip_country $country_blocked {
        default 0;
    }

    # --- access log with GeoIP fields -----------------------------------
    log_format geoip_log
        '$remote_addr - [$time_local] "$request" $status '
        'country=$geoip_country asn=$geoip_asn city=$geoip_city '
        'blocked=$country_blocked cache=$geoip_cache_status';

    server {
        # Plain HTTP for this example; put a real listen 443 ssl with your
        # own certificates (or a separate TLS-terminating proxy in front)
        # in an actual deployment.
        listen 8888;
        server_name example.invalid;

        access_log /var/log/nginx/access.log geoip_log;

        # Internal subrequest to nshgeoip over its UNIX socket. If NGINX
        # itself sits behind another proxy/load balancer, use the
        # appropriate real-IP variable instead of $remote_addr (e.g. one
        # set by ngx_http_realip_module).
        #
        # nginx's auth_request module only treats a 2xx subrequest
        # response as "allow"; 401/403 as "deny"; and ANY other status
        # (including nshgeoip's 400/404/500) as a hard subrequest error,
        # which would turn into a 500 for the real request. Since nshgeoip
        # performs annotation only and must never affect allow/deny,
        # proxy_intercept_errors plus error_page below coerce nshgeoip's
        # non-2xx responses into a bare 200 with no X-GeoIP-* headers --
        # i.e. "allow, just without annotation" -- instead of failing the
        # request.
        location = /_geoip {
            internal;

            proxy_pass http://unix:/run/nshgeoip/nshgeoip.sock:/lookup?ip=$remote_addr;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # nshgeoip is local and answers in well under a second; fail
            # fast rather than stalling the real request behind it.
            proxy_connect_timeout 500ms;
            proxy_read_timeout 1s;

            proxy_cache geoip_cache;
            proxy_cache_key $remote_addr;
            # Cache both "found" and "no data for this address" -- 404 is
            # just as stable and cacheable a result as 200 here. Deliberately
            # NOT caching 4xx/5xx failures below (400/405/500/etc, handled
            # via error_page): a transient nshgeoip hiccup should never get
            # cached as if it were a real answer.
            proxy_cache_valid 200 404 10m;
            proxy_cache_use_stale error timeout updating;

            proxy_intercept_errors on;
            error_page 400 404 405 500 502 503 504 = @geoip_unavailable;
        }

        location @geoip_unavailable {
            internal;
            return 200;
        }

        # Debug/test only: proxies straight through to nshgeoip's own
        # /lookup endpoint with whatever ?ip=... the client supplies, no
        # auth_request involved. Useful for ad-hoc lookups (curl any
        # address you want, not just $remote_addr), but note this has
        # none of the internal-only guarding location = /_geoip has --
        # don't expose this route on anything reachable beyond your own
        # testing.
        location /lookup {
            proxy_pass http://unix:/run/nshgeoip/nshgeoip.sock;
        }

        location / {
            auth_request /_geoip;

            auth_request_set $geoip_country      $upstream_http_x_geoip_country;
            auth_request_set $geoip_continent    $upstream_http_x_geoip_continent;
            auth_request_set $geoip_asn          $upstream_http_x_geoip_asn;
            auth_request_set $geoip_as_org       $upstream_http_x_geoip_as_org;
            # Only populated if city_db is configured in nshgeoip.conf.
            auth_request_set $geoip_city         $upstream_http_x_geoip_city;
            auth_request_set $geoip_postal       $upstream_http_x_geoip_postal_code;
            auth_request_set $geoip_lat          $upstream_http_x_geoip_latitude;
            auth_request_set $geoip_lon          $upstream_http_x_geoip_longitude;
            # $upstream_cache_status is HIT/MISS/EXPIRED/STALE/UPDATING/BYPASS --
            # captured here purely so it's observable via the response
            # header and access log below; not needed for the cache itself
            # to work.
            auth_request_set $geoip_cache_status $upstream_cache_status;

            # Policy: reject countries added to the map above. This runs
            # after auth_request_set, so $country_blocked reflects this
            # request's actual annotation.
            if ($country_blocked) {
                return 403;
            }

            # --- demo only: proves the pipeline works via `curl -i`, with
            # no backend required. A real deployment replaces this whole
            # block with something like:
            #
            #   proxy_set_header X-GeoIP-Country   $geoip_country;
            #   proxy_set_header X-GeoIP-Continent $geoip_continent;
            #   proxy_set_header X-GeoIP-ASN       $geoip_asn;
            #   proxy_set_header X-GeoIP-AS-Org    $geoip_as_org;
            #   proxy_set_header X-GeoIP-City        $geoip_city;
            #   proxy_set_header X-GeoIP-Postal-Code $geoip_postal;
            #   proxy_set_header X-GeoIP-Latitude    $geoip_lat;
            #   proxy_set_header X-GeoIP-Longitude   $geoip_lon;
            #   proxy_pass http://your_real_backend;
            #
            # -- forwarding the annotation as request headers to an actual
            # backend, rather than echoing it straight back to the client.
            add_header X-GeoIP-Country      $geoip_country always;
            add_header X-GeoIP-Continent    $geoip_continent always;
            add_header X-GeoIP-ASN          $geoip_asn always;
            add_header X-GeoIP-AS-Org       $geoip_as_org always;
            add_header X-GeoIP-City         $geoip_city always;
            add_header X-GeoIP-Postal-Code  $geoip_postal always;
            add_header X-GeoIP-Latitude     $geoip_lat always;
            add_header X-GeoIP-Longitude    $geoip_lon always;
            add_header X-GeoIP-Cache-Status $geoip_cache_status always;
            default_type text/plain;
            return 200 "remote_addr=$remote_addr country=$geoip_country continent=$geoip_continent asn=$geoip_asn as_org=$geoip_as_org city=$geoip_city postal=$geoip_postal lat=$geoip_lat lon=$geoip_lon\n";
        }
    }
}
