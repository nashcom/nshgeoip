name: Release

on:
  release:
    types: [published, edited]

jobs:
  release:
    name: Build & Upload Binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to upload release assets
      packages: write  # Required to push the image to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read version
        run: |
          VERSION=$(sed -n 's/.*NSHGEOIP_VERSION "\(.*\)".*/\1/p' src/version.h)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Builds the same Dockerfile a developer's ./build.sh would, via the
      # official Docker actions instead of shelling out to the docker CLI --
      # this also verifies the Dockerfile itself still builds, not just the
      # compile script in isolation. load: true keeps the image in the local
      # daemon (rather than pushing it anywhere) so the next step can pull
      # the binary back out of it. Cached via actions/cache (type=gha) so
      # the GHCR push step below doesn't have to recompile from scratch --
      # load and push can't happen in the same build-push-action step (a
      # known buildx limitation: docker/buildx#59), so this has to be two
      # separate builds either way.
      - name: Build static image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: nshgeoip:local
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract binary from image
        run: |
          CID=$(docker create nshgeoip:local)
          docker cp "$CID:/nshgeoip" ./nshgeoip
          docker rm "$CID" >/dev/null

      - name: Package release assets
        run: |
          BIN="nshgeoip-$VERSION"
          cp nshgeoip "$BIN"
          sha256sum "$BIN" > "$BIN.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nshgeoip-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: |
            ghcr.io/nashcom/nshgeoip:${{ env.VERSION }}
            ghcr.io/nashcom/nshgeoip:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
